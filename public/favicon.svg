<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="gy-bg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#132E22" />
      <stop offset="60%" stop-color="#2D6A4F" />
      <stop offset="100%" stop-color="#3A865F" />
    </linearGradient>
    <linearGradient id="gy-leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EAF3ED" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Squircle Base -->
  <rect width="32" height="32" rx="7.5" fill="url(#gy-bg)" />
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.75" fill="none" stroke="#52B788" stroke-width="0.8" stroke-opacity="0.35" />
  
  <!-- Stylized GreenYatra Leaf / Journey Pathway -->
  <path d="M7 25 C8 16, 13 8, 25 7 C 25 15, 20 24, 7 25 Z" fill="url(#gy-leaf)" />
  
  <!-- Central Leaf Vein / Travel Route Line -->
  <path d="M7 25 C12 21, 16.5 16, 25 7" stroke="#132E22" stroke-width="1.8" stroke-linecap="round" fill="none" />
  
  <!-- Branch Vein / Waypoint Marker -->
  <path d="M12.5 19 C 15 19, 17.5 18, 19.5 16" stroke="#2D6A4F" stroke-width="1.3" stroke-linecap="round" fill="none" />

  <!-- Marigold / Gold Destination Sun/Waypoint -->
  <circle cx="23.5" cy="8.5" r="2.3" fill="#D97706" />
</svg>
